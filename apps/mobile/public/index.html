<!doctype html>
<!--
  Vorlage für den Web-Export der App (expo export, output 'single'). Basis: Standard-Vorlage von Expo
  (@expo/cli/static/template/index.html), ergänzt um das Apple-Touch-Icon für „Zum Home-Bildschirm“.
  Titel, Sprache, Favicon und Skripte setzt Expo beim Export ein.
  viewport-fit=cover: Die App reicht bis unter die Home-Leiste des iPhones; die sicheren Ränder (env(safe-area-inset-*))
  liest react-native-safe-area-context im Browser aus – Menüleiste und Fußknöpfe bleiben darüber (Wächter N8).
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Schriften liegen in public/fonts (OFL, Lizenztexte daneben) – kein Google-Fonts-Server (DSGVO).
      Plus Jakarta Sans = App-Schrift (--font-family-base in packages/ui/theme.css).
      Archivo = Überschriften der Druck-Vorschau (wie die PDFs); wird nur geladen, wenn sie dort gebraucht wird.
    -->
    <style id="alpha5-font">
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('/fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Archivo';
        src: url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-style: normal;
        font-display: swap;
      }
      /* App-Schrift für die ganze App im Browser (überschreibt die Systemschrift von react-native-web). */
      #root * {
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>Bitte JavaScript aktivieren, um die App zu nutzen.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
