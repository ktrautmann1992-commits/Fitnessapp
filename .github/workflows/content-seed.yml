name: content-seed

# Spielt freigegebene Inhalte (status = published) in Supabase ein (docs/PLAN-PHASE-2.md Abschnitt 4,
# Schritt 4): automatisch nach jedem Merge in main, der content/ ändert, nach jeder erfolgreichen
# Migration (db-migrate) und per Hand.
# 1. Prüft vorher selbst ALLE Inhalte (content:validate) – bei einem einzigen blockierenden Fehler wird
#    NICHTS eingespielt.
# 2. Baut das Einspiel-Paket (nur published, geschätzte Dauer je Einheit) und ruft seed_content auf –
#    eine Transaktion, mehrfaches Ausführen ändert nichts.
# Ohne SUPABASE_URL/SUPABASE_SECRET_KEY endet der Workflow nach der Prüfung grün mit Hinweis.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '.github/workflows/content-seed.yml'
  workflow_run:
    workflows: [db-migrate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-seed
  cancel-in-progress: false

jobs:
  seed:
    # Nach db-migrate nur, wenn die Migration geklappt hat.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secrets prüfen
        id: secrets
        env:
          HAS_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
        run: |
          missing=""
          [ "$HAS_URL" != "true" ] && missing="$missing SUPABASE_URL"
          [ "$HAS_KEY" != "true" ] && missing="$missing SUPABASE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::notice title=content-seed übersprungen::Es fehlen GitHub-Secrets:$missing – Inhalte werden nur geprüft, nicht eingespielt. Siehe docs/SETUP.md"
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets nur in diesem Schritt. Das Skript prüft zuerst alles und spielt nur ohne Fehler ein.
      - name: Inhalte prüfen und einspielen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm --filter @fitnessapp/content seed
