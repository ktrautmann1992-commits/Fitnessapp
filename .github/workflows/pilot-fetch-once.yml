name: pilot-fetch-once
# Einmal-Ablauf: lädt Probebilder (Übungsbilder-Pilot) als Kontaktbogen auf diesen Branch. Wird nie nach main übernommen.
on:
  push:
    branches: [claude/bild-pilot]
    paths: [.github/workflows/pilot-fetch-once.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
          b=https://d8j0ntlcm91z4.cloudfront.net/user_3H4lYbkHxzmQw3EACNeAeWBFHJq
          mkdir -p pilot2 && cd pilot2
          i=0
          for f in hf_20261115_140720_d2746cd6-cfa7-49fb-a935-0d998e8d78fd hf_20261115_140745_8d26e455-177d-40a1-bd7f-ba1c9f8c5287 hf_20261115_140720_2e21af91-b9ac-4ccc-bd47-eb89a54aa467 hf_20261115_140745_684347ac-482b-44e3-baf2-43ded807f395 hf_20261115_140720_9444d21d-848c-48c6-b9ee-6b384774f74d hf_20261115_140746_fb14202c-47f4-43c1-9da8-94d76938bbb1; do
            i=$((i+1)); curl -fsSL -o $i.png "$b/$f.png"; identify $i.png; convert $i.png -resize 480x360 $i.jpg; rm $i.png
          done
          montage 1.jpg 2.jpg 3.jpg 4.jpg 5.jpg 6.jpg -tile 2x3 -geometry +6+6 kontaktbogen.jpg
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add pilot2 && git commit -m "Pilot 2: günstige Übungsbilder (Kontaktbogen)" && git push
