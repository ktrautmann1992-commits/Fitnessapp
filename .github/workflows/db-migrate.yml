name: db-migrate

# Spielt neue Datenbank-Migrationen (supabase/migrations) nach dem Merge in main ein.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Secrets prüfen
        id: secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::notice title=db-migrate übersprungen::Es fehlen GitHub-Secrets:$missing – siehe docs/SETUP.md"
            echo "### ⏭️ db-migrate übersprungen" >> "$GITHUB_STEP_SUMMARY"
            echo "Es fehlen GitHub-Secrets:$missing. Anleitung: docs/SETUP.md" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Mit Supabase-Projekt verbinden
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrationen einspielen
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --include-all
      - name: Zusammenfassung
        if: steps.secrets.outputs.ready == 'true'
        run: echo "### ✅ Datenbank-Migrationen eingespielt" >> "$GITHUB_STEP_SUMMARY"
