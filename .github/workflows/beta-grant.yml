name: beta-grant

# Beta-Freischaltung und Feature-Flags bis Phase 7 (docs/PLAN-PHASE-4B.md 6.3, docs/PLAN-AUSWERTUNG.md Etappe E3, A-G20).
# Seit E4a auch das Flag food_product_lookup (Produktabfrage per Barcode-Nummer, Migration 20261017100000_food_products.sql;
# gratis, nur flag_an/flag_aus/status – keine Freischaltung je Person).
# Nur per Hand: GitHub-App → Actions → beta-grant → „Run workflow“. Nur wer Schreibrechte am Repository hat, kann ihn
# starten; GitHub merkt sich, wer. Ruft public.beta_admin(...) (Migration 20261016160100_ai_food_photo.sql) mit den
# GitHub-Secrets SUPABASE_URL und SUPABASE_SECRET_KEY auf. Ohne Secrets endet der Workflow grün mit Hinweis.
#
# Sicherheit (PLAN-PHASE-4B 6.3, Wächter S-n2):
# - Eingaben und github.actor nur über env:, nie als ${{ }} im run-Text (die E-Mail ist Freitext).
# - E-Mail VOR jeder Ausgabe gegen ein festes Muster geprüft, erst danach maskiert (kein Einschleusen von Befehlen).
# - JSON nur mit jq -n --arg/--argjson, Antwort nur über feste Felder in die Zusammenfassung – nie E-Mail oder user_id.
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: 'Was soll passieren?'
        required: true
        type: choice
        options:
          - status
          - freischalten
          - entziehen
          - flag_an
          - flag_aus
      email:
        description: 'E-Mail des Kontos (nur bei freischalten/entziehen)'
        required: false
        type: string
      tage:
        description: 'Gültigkeit in Tagen (1–180, nur bei freischalten)'
        required: false
        default: '90'
        type: string
      monatslimit:
        description: 'Fotos je Monat für dieses Konto (1–300, leer = Standard 30; nur bei freischalten)'
        required: false
        default: ''
        type: string
      tageslimit:
        description: 'Fotos je Tag für dieses Konto (1–50, leer = Standard 8; nur bei freischalten)'
        required: false
        default: ''
        type: string
      flag:
        description: 'Funktion (Feature-Flag)'
        required: true
        type: choice
        options:
          - ai_food_photo
          - food_product_lookup

permissions:
  contents: read

concurrency:
  group: beta-grant
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Eingaben prüfen
        id: input
        env:
          AKTION: ${{ inputs.aktion }}
          EMAIL: ${{ inputs.email }}
          TAGE: ${{ inputs.tage }}
          MONAT: ${{ inputs.monatslimit }}
          TAG: ${{ inputs.tageslimit }}
          FLAG: ${{ inputs.flag }}
        run: |
          set -euo pipefail
          case "$AKTION" in
            freischalten) action=grant ;;
            entziehen) action=revoke ;;
            flag_an) action=flag_on ;;
            flag_aus) action=flag_off ;;
            status) action=status ;;
            *) echo "::error::Unbekannte Aktion."; exit 1 ;;
          esac
          case "$FLAG" in
            ai_food_photo) ;;
            food_product_lookup)
              # E4a: gratis, keine Freischaltung je Person – nur flag_an/flag_aus/status.
              if [ "$action" = grant ] || [ "$action" = revoke ]; then
                echo "::error::Die Produktabfrage hat keine Freischaltung je Person – nur flag_an, flag_aus oder status."
                exit 1
              fi
              ;;
            *) echo "::error::Unbekannte Funktion."; exit 1 ;;
          esac
          if [ "$action" = grant ] || [ "$action" = revoke ]; then
            # Erst prüfen (ohne Echo), dann maskieren.
            if ! printf '%s' "$EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,253}\.[A-Za-z]{2,}$' \
              || [ "$(printf '%s' "$EMAIL" | wc -l)" != "0" ]; then
              echo "::error::Die E-Mail-Adresse hat kein gültiges Format."
              exit 1
            fi
            echo "::add-mask::$EMAIL"
          fi
          if [ "$action" = grant ]; then
            if ! printf '%s' "$TAGE" | grep -Eq '^[0-9]{1,3}$' || [ "$TAGE" -lt 1 ] || [ "$TAGE" -gt 180 ]; then
              echo "::error::Tage bitte als ganze Zahl von 1 bis 180."
              exit 1
            fi
            # Limits je Person (Wächter E3 N6): leer = Standard, sonst ganze Zahl im erlaubten Bereich.
            if [ -n "$MONAT" ] && { ! printf '%s' "$MONAT" | grep -Eq '^[0-9]{1,3}$' || [ "$MONAT" -lt 1 ] || [ "$MONAT" -gt 300 ]; }; then
              echo "::error::Monatslimit bitte als ganze Zahl von 1 bis 300 (oder leer)."
              exit 1
            fi
            if [ -n "$TAG" ] && { ! printf '%s' "$TAG" | grep -Eq '^[0-9]{1,2}$' || [ "$TAG" -lt 1 ] || [ "$TAG" -gt 50 ]; }; then
              echo "::error::Tageslimit bitte als ganze Zahl von 1 bis 50 (oder leer)."
              exit 1
            fi
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: beta_admin aufrufen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ACTION: ${{ steps.input.outputs.action }}
          EMAIL: ${{ inputs.email }}
          TAGE: ${{ inputs.tage }}
          MONAT: ${{ inputs.monatslimit }}
          TAG: ${{ inputs.tageslimit }}
          FLAG: ${{ inputs.flag }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::notice title=beta-grant übersprungen::Es fehlen die GitHub-Secrets SUPABASE_URL und/oder SUPABASE_SECRET_KEY. Siehe docs/SETUP.md Teil B."
            exit 0
          fi
          if [ "$ACTION" = grant ]; then
            echo "::add-mask::$EMAIL"
            # Tage und Limits sind im Schritt vorher geprüft; leere Limits = null (Standard).
            body=$(jq -n --arg a "$ACTION" --arg actor "$ACTOR" --arg e "$EMAIL" --argjson d "$TAGE" --arg f "$FLAG" \
              --arg m "$MONAT" --arg t "$TAG" \
              '{p_action: $a, p_actor: $actor, p_email: $e, p_days: $d, p_flag: $f,
                p_monthly_limit: (if $m == "" then null else ($m | tonumber) end),
                p_daily_limit: (if $t == "" then null else ($t | tonumber) end)}')
          elif [ "$ACTION" = revoke ]; then
            # Wächter E3 N5: beim Entziehen keine Tage (nicht geprüft, nicht gebraucht).
            echo "::add-mask::$EMAIL"
            body=$(jq -n --arg a "$ACTION" --arg actor "$ACTOR" --arg e "$EMAIL" --arg f "$FLAG" \
              '{p_action: $a, p_actor: $actor, p_email: $e, p_flag: $f}')
          else
            body=$(jq -n --arg a "$ACTION" --arg actor "$ACTOR" --arg f "$FLAG" \
              '{p_action: $a, p_actor: $actor, p_flag: $f}')
          fi
          umask 077
          headers="$RUNNER_TEMP/headers.txt"
          {
            echo "apikey: $SUPABASE_SECRET_KEY"
            echo "Content-Type: application/json"
            case "$SUPABASE_SECRET_KEY" in eyJ*) echo "Authorization: Bearer $SUPABASE_SECRET_KEY" ;; esac
          } > "$headers"
          status=$(curl -sS -o "$RUNNER_TEMP/antwort.json" -w '%{http_code}' -X POST \
            -H @"$headers" --data "$body" "${SUPABASE_URL%/}/rest/v1/rpc/beta_admin")
          rm -f "$headers"
          if [ "$status" != "200" ]; then
            echo "::error title=beta-grant fehlgeschlagen::HTTP $status – ist die Migration eingespielt (db-migrate)?"
            exit 1
          fi
          # Nur feste Felder – nie E-Mail oder user_id.
          result=$(jq -r '.result // "unbekannt"' "$RUNNER_TEMP/antwort.json")
          case "$result" in
            granted) text="Freischaltung gesetzt, gültig bis $(jq -r '.expires_on' "$RUNNER_TEMP/antwort.json")." ;;
            revoked) text="Freischaltung entzogen." ;;
            not_found) text="Kein Konto mit dieser E-Mail." ;;
            flag_on) text="Funktion $FLAG eingeschaltet." ;;
            flag_off) text="Funktion $FLAG ausgeschaltet." ;;
            invalid_input) text="Ungültige Eingabe." ;;
            status)
              if [ "$FLAG" = food_product_lookup ]; then
                text=$(jq -r '"Funktion \(.flag): \(if .flag_enabled then "an" else "aus" end) · Produkte im Speicher: \(.cached_products) · Abfragen heute: \(.lookups_today) · Open Food Facts gerade gesperrt (Pause): \(if .off_blocked then "ja" else "nein" end)"' "$RUNNER_TEMP/antwort.json")
              else
                text=$(jq -r '"Funktion \(.flag): \(if .flag_enabled then "an" else "aus" end) · aktive Freischaltungen: \(.active_grants) · Fotos diesen Monat: \(.photos_this_month) (fehlgeschlagen: \(.failed_this_month)) · Kosten diesen Monat: \(.cost_eur_this_month) €"' "$RUNNER_TEMP/antwort.json")
              fi
              ;;
            *) text="Unbekannte Antwort." ;;
          esac
          rm -f "$RUNNER_TEMP/antwort.json"
          echo "$text"
          echo "### beta-grant" >> "$GITHUB_STEP_SUMMARY"
          echo "$text" >> "$GITHUB_STEP_SUMMARY"
