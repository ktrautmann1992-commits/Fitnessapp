name: content-collect

# Holt fertige Batch-Ergebnisse ab (docs/PLAN-PHASE-2.md Abschnitt 4, Schritt 2): alle 3 Stunden per
# Zeitplan und per Hand (Actions → content-collect → Run workflow).
# - Kein offener Batch-Branch (content/batch-*, Merkdatei mit status „submitted“) → Ende nach wenigen
#   Sekunden, ohne Installation und ohne Schlüssel. (Alle 3 statt jede Stunde: GitHub rundet jeden Lauf auf
#   eine volle Minute auf.)
# - Probeläufe gehen ohne Schlüssel; echte Läufe brauchen GEMINI_API_KEY (Google Gemini Batch API, seit
#   15.10.2026, docs/PLAN-PHASE-5.md N8). Der Schlüssel wird nie geloggt und landet in keiner Datei.
# - Zuordnung nur über custom_id (Gemini: metadata.key); gültige Antworten werden Entwürfe (status draft),
#   alles andere steht im Bericht. Freigabe bleibt menschlich (Pull Request + content-review).
# - Vor dem Pull Request: content:validate (alle Inhalte), Prettier und Typprüfung. Rot → kein Pull Request.
# - Pull Request mit BOT_PR_TOKEN (falls hinterlegt) → ci startet von selbst; sonst mit dem GITHUB_TOKEN und ci wird
#   für den Branch gestartet (solche Pull Requests brauchen sonst „Approve and run“, docs/SETUP.md Teil P).
# Der Workflow öffnet nur Pull Requests – er genehmigt NIE.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: content-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Offene Batch-Läufe suchen
        id: open
        env:
          EVENT: ${{ github.event_name }}
        run: |
          refs=$(git ls-remote --heads origin 'refs/heads/content/batch-*' | awk '{print $2}')
          if [ -z "$refs" ]; then
            echo "### ⏭️ content-collect: keine offenen Batch-Läufe" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Per Hand gestartet: immer prüfen (holt z. B. einen fehlenden Pull Request nach).
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=false
          for ref in $refs; do
            name="${ref#refs/heads/content/batch-}"
            git fetch --quiet --no-tags origin "$ref"
            status=$(git show "FETCH_HEAD:content/batches/${name}.json" 2>/dev/null | jq -r '.status // empty' || true)
            if [ "$status" = "submitted" ]; then
              open=true
            fi
          done
          if [ "$open" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "### ⏭️ content-collect: keine offenen Batch-Läufe (alle schon abgeholt)" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.open.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.open.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.open.outputs.run == 'true'
      # Schlüssel und Token nur in diesem Schritt.
      - name: Ergebnisse abholen, prüfen, Pull Request öffnen
        if: steps.open.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Nur für den Pull Request (docs/SETUP.md Teil P): Pull Requests dieses Tokens starten die Pflicht-Checks
          # ohne „Approve and run“. Fehlt das Secret, geht alles wie bisher mit dem GITHUB_TOKEN. Commits bleiben beim
          # GITHUB_TOKEN (verifiziert, github-actions[bot]).
          BOT_PR_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: pnpm --filter @fitnessapp/content collect
