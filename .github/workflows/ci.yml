name: ci

# Prüft bei jeder Änderung: Formatierung, Inhalte (content:validate), Lint, Typen, Tests und ob beide Apps bauen.
# „Run workflow“ (workflow_dispatch) startet die Prüfung auch von Hand bzw. für Pull Requests von Workflows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Wöchentlich: Herkunft der Nährwert-Quellen (Original-Datei neu laden, Job sources-integrity).
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  # Eigene Gruppe je Ereignis: Der Wochenlauf und ein Push auf main brechen sich nicht gegenseitig ab (K3).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typen, Tests, Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75 # E2E allein ~25 min (246 Specs); mit Unit-Tests, Build und Last reichten 45 nicht mehr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatierung prüfen
        run: pnpm format:check
      # Passt die App (tokens.generated.ts) noch zum Farbschema der Website (theme.css)? Siehe docs/DESIGN.md.
      - name: Farbschema prüfen (theme.css → App-Tokens)
        run: pnpm --filter @fitnessapp/ui tokens:check
      # Schrift (Archivo) und Logo für den PDF-Export als eingebettetes Modul – passt es noch zu den Dateien?
      # Siehe docs/PLAN-PDF-EXPORT.md §5 (B6).
      - name: Druck-Assets prüfen (Schrift + Logo → assets.generated.ts)
        run: pnpm --filter @fitnessapp/ui print-assets:check
      # Prüft alle Inhalte unter content/ (Übungen, Plan-Vorlagen) mit den Regeln aus docs/PLAN-PHASE-2.md
      # Abschnitt 7. Schlägt fehl bei Schema-/Dateifehlern und bei roten Fehlern an FREIGEGEBENEN Inhalten;
      # der Bericht steht zusätzlich in der Zusammenfassung des Laufs. Der Vergleich mit main prüft, ob
      # geänderte freigegebene Inhalte eine höhere Version haben.
      - name: Vergleichsstand main holen (für die Versionsregel)
        run: >
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          || echo "::notice::main nicht abrufbar – die Versionsregel wird übersprungen."
      - name: Inhalte prüfen (content:validate)
        run: pnpm content:validate --base origin/main
      # Plan-Engine (docs/PLAN-PHASE-3.md): erzeugt für feste, ausgedachte Test-Personen Beispielpläne aus dem
      # aktuellen Inhaltsstand und schreibt sie lesbar in die Zusammenfassung des Laufs (Summary).
      - name: Beispielpläne (Plan-Engine)
        run: pnpm plan:examples
      # Ernährungs-Engine (docs/PLAN-PHASE-5.md, Etappe N1): Tagesziele einer Woche für ausgedachte Test-Personen A–H
      # (Schutzgrenzen, Sonderfälle) als Tabelle „Beispiel-Ernährung“ in der Zusammenfassung des Laufs (Summary).
      - name: Beispiel-Ernährung (Ernährungs-Engine)
        run: pnpm nutrition:examples
      # Live-Anpassung (docs/PLAN-PHASE-4B.md, Etappe A): ausgedachte Tagebuch-Folgen für Test-Personen und die
      # Anpassung mit Erklärsatz (u. a. „Erholungswoche vorgezogen“ mit Wochen-Übersicht) als „Beispiel-Anpassungen“.
      - name: Beispiel-Anpassungen (Live-Anpassung)
        run: pnpm adjust:examples
      # Supplement-Modul (docs/PLAN-PHASE-6.md, Etappe SU1): Einordnung (passt/Info/ab 18/nicht für dich), Dosis und
      # Koffein-Sicherheits-Info für zehn ausgedachte Test-Personen als „Beispiel-Empfehlungen (Supplemente)“.
      - name: Beispiel-Empfehlungen (Supplemente)
        run: pnpm supplements:examples
      - name: Lint, Typen, Tests
        run: pnpm check
      # PDF-Export (docs/PLAN-PDF-EXPORT.md §8 P1+P2): Trainingsplan für ausgedachte Beispiel-Personen als Druck-HTML.
      # Am Handy: Actions → ci-Lauf → Artefakt „pdf-vorschau“ → HTML öffnen → Drucken → „Als PDF sichern“.
      - name: PDF-Vorschau erzeugen
        run: pnpm --filter @fitnessapp/mobile pdf:preview
      - name: PDF-Vorschau hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pdf-vorschau
          path: apps/mobile/pdf-vorschau
          retention-days: 14
      - name: Apps bauen
        run: pnpm build
      # Klickt die Web-Version der App (Testmodus, Handy-Ansicht) einmal komplett durch.
      - name: Browser für E2E-Tests installieren
        run: pnpm --filter @fitnessapp/mobile exec playwright install --with-deps chromium
      - name: E2E-Tests (App im Browser, Testmodus)
        run: pnpm --filter @fitnessapp/mobile test:e2e
      # Klickt den Redaktionsbereich (/admin) der Website durch: gesperrt ohne Zugangsdaten, Login falsch/richtig,
      # Cookie-Flags, Übersicht (52 Übungen, 24 Vorlagen), Filter, Details, Abmelden. Läuft gegen den gebauten
      # Stand (next start) mit Test-Zugangsdaten aus apps/web/e2e/test-env.ts (keine echten Secrets).
      - name: E2E-Tests (Website, Redaktionsbereich)
        run: pnpm --filter @fitnessapp/web test:e2e
      - name: E2E-Bericht hochladen (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Herkunft der Nährwert-Quellen (docs/PLAN-PHASE-5.md 5.1.1 b, H1, W18): lädt die Original-Datei IMMER neu – von
  # der Adresse aus sources.ts auf main –, prüft Prüfsummen, dass jede Zeile von extract.csv unverändert aus der
  # Original-Datei stammt, und dass jeder Commit unter content/sources/** bzw. content/foods/** ein von GitHub
  # verifizierter Commit von github-actions[bot] (Workflow foods-import) ist. Läuft bei jedem PR (Neuladen nur, wenn
  # Quellen, Lebensmittel oder Import-Skripte geändert sind), auf main und wöchentlich.
  sources-integrity:
    name: sources-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      # Im Pull Request den echten Kopf-Commit prüfen (nicht den künstlichen Merge-Commit von GitHub).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Vergleichsstand main holen (Allowlist sources.ts von main)
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Herkunft der Quellauszüge prüfen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Kopf-Repository des PRs (Fork-Erkennung, Wächter N2b S1); leer außerhalb von Pull Requests.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: pnpm --filter @fitnessapp/content sources:integrity
