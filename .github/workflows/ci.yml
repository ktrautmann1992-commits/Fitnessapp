name: ci

# Prüft bei jeder Änderung: Formatierung, Lint, Typen, Tests und ob beide Apps bauen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatierung prüfen
        run: pnpm format:check
      - name: Lint, Typen, Tests
        run: pnpm check
      - name: Apps bauen
        run: pnpm build
