name: media-fetch-once
# Einmal-Ablauf: ergänzt die fehlenden Barbell-Burn-Bildgrößen. Wird danach wieder gelöscht.
on:
  push:
    branches: [claude/barbell-burn-media]
    paths: [.github/workflows/media-fetch-once.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bilder laden und umrechnen
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          base=https://d8j0ntlcm91z4.cloudfront.net/user_3H4lYbkHxzmQw3EACNeAeWBFHJq
          curl -fsSL -o /tmp/b.png "$base/hf_20261114_132846_f920445c-1b29-4014-9473-ee60a9f1efcc.png"
          curl -fsSL -o /tmp/t.png "$base/hf_20261114_132846_a8a25d04-96d0-428b-84b0-7d4e99c72af8.png"
          out=apps/mobile/assets/workout-media
          # 60 min: Kachel aus Bild 1 (Frau rechts im Bild)
          convert /tmp/b.png -resize x672 -gravity east -crop 672x672+60+0 +repage -resize 320x320 /tmp/b60.png
          # 30 min: Banner aus Bild 2 (oberer Bildteil mit Gesicht und Hantel)
          convert /tmp/t.png -resize 1080x -gravity north -crop 1080x463+0+120 +repage /tmp/t30.png
          cwebp -quiet -q 80 /tmp/b60.png -o "$out/barbell-burn-60-thumb.webp"
          cwebp -quiet -q 80 /tmp/t30.png -o "$out/barbell-burn-30-banner.webp"
          ls -la "$out"
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/workout-media
          git commit -m "Barbell Burn: Kachel (60) und Banner (30) ergänzt"
          git push
