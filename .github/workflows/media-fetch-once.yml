name: media-fetch-once
# Einmal-Ablauf: lädt die Barbell-Burn-Bilder (Higgsfield) herunter, rechnet sie
# auf App-Größe um und committet sie auf diesen Branch. Wird danach wieder gelöscht.
on:
  push:
    branches: [claude/barbell-burn-media]
    paths: [.github/workflows/media-fetch-once.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bilder laden und umrechnen
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          base=https://d8j0ntlcm91z4.cloudfront.net/user_3H4lYbkHxzmQw3EACNeAeWBFHJq
          curl -fsSL -o /tmp/b.png "$base/hf_20261114_132846_f920445c-1b29-4014-9473-ee60a9f1efcc.png"
          curl -fsSL -o /tmp/t.png "$base/hf_20261114_132846_a8a25d04-96d0-428b-84b0-7d4e99c72af8.png"
          out=apps/mobile/assets/workout-media
          mkdir -p "$out"
          convert /tmp/b.png -resize 1080x463^ -gravity center -extent 1080x463 /tmp/b2.png
          convert /tmp/t.png -resize 320x320^ -gravity center -extent 320x320 /tmp/t2.png
          cwebp -quiet -q 80 /tmp/b2.png -o "$out/barbell-burn-banner.webp"
          cwebp -quiet -q 80 /tmp/t2.png -o "$out/barbell-burn-thumb.webp"
          ls -la "$out"
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/workout-media
          git commit -m "Barbell-Burn-Bilder (Banner + Kachel) eingebunden"
          git push
