name: media-fetch-once
# Einmal-Ablauf: ersetzt das Barbell-Burn-30-Banner durch die erweiterte Breitbild-Fassung. Wird danach gelöscht.
on:
  push:
    branches: [claude/barbell-burn-media]
    paths: [.github/workflows/media-fetch-once.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bild laden und umrechnen
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          curl -fsSL -o /tmp/w.png "https://d8j0ntlcm91z4.cloudfront.net/user_3H4lYbkHxzmQw3EACNeAeWBFHJq/hf_20261114_135109_3473bf65-ab9c-4f2e-816a-3c362d20f5d8.png"
          identify /tmp/w.png
          convert /tmp/w.png -resize 1080x463^ -gravity center -extent 1080x463 /tmp/w2.png
          cwebp -quiet -q 80 /tmp/w2.png -o apps/mobile/assets/workout-media/barbell-burn-30-banner.webp
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/workout-media
          git commit -m "Barbell Burn 30: Banner als erweitertes Breitbild (ganze Person sichtbar)"
          git push
